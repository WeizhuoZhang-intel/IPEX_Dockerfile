name: LLM Benchmarking
hw: SPR-SP/HBM/EMR
envconfig:
  # LD_PRELOAD: ${CONDA_PREFIX}/lib/libstdc++.so.6:${LD_PRELOAD}:${CONDA_PREFIX}/lib/libtcmalloc.so
  LD_PRELOAD: ${CONDA_PREFIX}/lib/libiomp5.so:${LD_PRELOAD}:${CONDA_PREFIX}/lib/libtcmalloc.so
  KMP_BLOCKTIME: INF
  KMP_AFFINITY: granularity=fine,compact,1,0
  threads_per_core: $(lscpu |grep 'Thread(s) per core:' |sed 's/[^0-9]//g')
  cores_per_node: $(numactl -H |grep "node 0 cpus:" |sed 's/.*://' |awk -v tpc=$threads_per_core '{print int(NF / tpc)}')
  LLM_EXTRA_KMP:
    KMP_TPAUSE: 0
    KMP_SETTINGS: 1
    KMP_FORJOIN_BARRIER_PATTERN: dist,dist
    KMP_PLAIN_BARRIER_PATTERN: dist,dist
    KMP_REDUCTION_BARRIER_PATTERN: dist,dist
launcher:
  OMP_NUM_THREADS: ${cores_per_node}
  numactlN: 0
  numactlM: 0
  iternum: 10
  warmup: 5
  hw: EMR
modelargs:
  llama13_bf16ds:
    modelid: 
      - meta-llama/Meta-Llama-3-8B
      # - meta-llama/Meta-Llama-3-70B
    scriptname: run.py
    device:
      - cpu
    dtype: 
      - ds-bfloat16
    maxnewtokens: 
      - 128
    outputdir: "/data/mint/shard"
    inputtokens:
      - 256
      - 512
      - 1024
      # - 2048
    batchsize: 
      # - 1
      # - 2
      # - 4
      # - 8
      # - 6
      # - 10
      # - 12
      # - 16
      - 32
      - 64
    localrank:
      - 2
      - 4
    greedy: 
      - True
    shard: False

  llama123_woqds:
    modelid: 
      - meta-llama/Meta-Llama-3-8B
      # - meta-llama/Meta-Llama-3-70B
    scriptname: run.py
    device:
      - cpu
    dtype: 
      - ds-woq-int8
      # - ds-woq-int4
    maxnewtokens: 
      - 128
    outputdir: "/data/mint/shard"
    inputtokens:
      - 256
      - 512
      - 1024
    batchsize: 
      # - 1
      # - 2
      # - 4
      # - 6
      # - 8
      # - 10
      # - 12
      # - 16
      - 32
      - 64
    localrank:
      - 2
      - 4
    greedy: 
      - True
    shard: False
 