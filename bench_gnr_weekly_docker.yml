name: LLM Benchmarking
hw: SPR-SP/HBM/EMR
envconfig:
  # LD_PRELOAD: ${CONDA_PREFIX}/lib/libstdc++.so.6:${LD_PRELOAD}:${CONDA_PREFIX}/lib/libtcmalloc.so
  LD_PRELOAD: ${CONDA_PREFIX}/lib/libiomp5.so:${LD_PRELOAD}:${CONDA_PREFIX}/lib/libtcmalloc.so
  KMP_BLOCKTIME: INF
  KMP_AFFINITY: granularity=fine,compact,1,0
  threads_per_core: $(lscpu |grep 'Thread(s) per core:' |sed 's/[^0-9]//g')
  cores_per_node: $(numactl -H |grep "node 0 cpus:" |sed 's/.*://' |awk -v tpc=$threads_per_core '{print int(NF / tpc)}')
  LLM_EXTRA_KMP:
    KMP_TPAUSE: 0
    KMP_SETTINGS: 1
    KMP_FORJOIN_BARRIER_PATTERN: dist,dist
    KMP_PLAIN_BARRIER_PATTERN: dist,dist
    KMP_REDUCTION_BARRIER_PATTERN: dist,dist
launcher:
  OMP_NUM_THREADS: ${cores_per_node}
  numactlN: 0
  numactlM: 0
  iternum: 15
  warmup: 10
  hw: GNR
modelargs:
  model_bf16:
    modelid: 
      - microsoft/phi-2
    scriptname: run.py
    device:
      - cpu
    dtype: 
      - bfloat16
    maxnewtokens: 
      - 128
    inputtokens:
      - 128
      - 512
      - 1024
      - 2016
    batchsize: 
      - 1
    localrank:
      - 1
    greedy: 
      - False
      - True

  agptj_woq8:
    modelid: 
      - microsoft/phi-2
    scriptname: run.py
    device:
      - cpu
    dtype: 
      - woq-int8
    maxnewtokens: 
      - 128
    outputdir: "/mnt/aitrgdata/mint/woq-int8"
    quantizedmodelpath: "/mnt/aitrgdata/mint/woq-int8"
    inputtokens:
      - 128
      - 512
      - 1024
      - 2016
    batchsize: 
      - 1
    localrank:
      - 1
    greedy: 
      - False
      - True
